spring:
  application:
    name: chunking-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest

server:
  port: 8082

logging:
  level:
    com.rag: INFO
    org.apache.kafka: WARN
  pattern:
    level: "%5p [${spring.application.name:unknown-service}]"

chunking:
  output-root: ../storage/chunks
  default-strategy: fixed-size
  kafka:
    document-text-extracted-events-topic: document-text-extracted-events
    document-chunked-events-topic: document-chunked-events
    group-id: chunking-group
    trusted-packages: com.rag.common.model
    send-timeout-seconds: 30
